# Paths are relative to THIS config, not the shell's working directory.
# List one literal path per line. Directory scans are recursive.
# All 30 NSD variants and their linked fuzzing executables.
[scan]
object_dirs =
    ../build/build_1
    ../build/build_2
    ../build/build_3
    ../build/build_4
    ../build/build_5
    ../build/build_6
    ../build/build_7
    ../build/build_8
    ../build/build_9
    ../build/build_10
    ../build/build_11
    ../build/build_12
    ../build/build_13
    ../build/build_14
    ../build/build_15
    ../build/build_16
    ../build/build_17
    ../build/build_18
    ../build/build_19
    ../build/build_20
    ../build/build_21
    ../build/build_22
    ../build/build_23
    ../build/build_24
    ../build/build_25
    ../build/build_26
    ../build/build_27
    ../build/build_28
    ../build/build_29
    ../build/build_30
binary_paths =
    ../run/run_1/sbin/nsd
    ../run/run_2/sbin/nsd
    ../run/run_3/sbin/nsd
    ../run/run_4/sbin/nsd
    ../run/run_5/sbin/nsd
    ../run/run_6/sbin/nsd
    ../run/run_7/sbin/nsd
    ../run/run_8/sbin/nsd
    ../run/run_9/sbin/nsd
    ../run/run_10/sbin/nsd
    ../run/run_11/sbin/nsd
    ../run/run_12/sbin/nsd
    ../run/run_13/sbin/nsd
    ../run/run_14/sbin/nsd
    ../run/run_15/sbin/nsd
    ../run/run_16/sbin/nsd
    ../run/run_17/sbin/nsd
    ../run/run_18/sbin/nsd
    ../run/run_19/sbin/nsd
    ../run/run_20/sbin/nsd
    ../run/run_21/sbin/nsd
    ../run/run_22/sbin/nsd
    ../run/run_23/sbin/nsd
    ../run/run_24/sbin/nsd
    ../run/run_25/sbin/nsd
    ../run/run_26/sbin/nsd
    ../run/run_27/sbin/nsd
    ../run/run_28/sbin/nsd
    ../run/run_29/sbin/nsd
    ../run/run_30/sbin/nsd

# These expectations match the CFLAGS in build.sh. A failure means the ELF
# artifact has no static evidence for the requested instrumentation.
[checks]
asan = present
ubsan = present
sancov = present
sancov_cmp = ignore
sancov_pc_table = ignore
llvm_profile = present
source_coverage = present
# The libFuzzer driver belongs only in the linked nsd fuzzing executables.
libfuzzer = ignore
coverbridge = ignore

[checks:../run/run_*/sbin/nsd]
ubsan = ignore
sancov_cmp = ignore
libfuzzer = present
coverbridge = present

# The controller and CoverBridge support code are deliberately outside the
# shared trace-pc-guard map. Only NSD target code contributes worker coverage.
[checks:../build/build_*/fuzzer.o]
sancov = absent

[checks:../build/build_*/covbridge-*.o]
sancov = absent

# These files have no runtime code in the selected NSD configurations. ASan can
# still emit global metadata, but code-oriented sanitizer and coverage hooks have
# nothing to instrument.
[checks:../build/build_*/metrics.o]
ubsan = ignore
sancov = ignore
sancov_cmp = ignore
sancov_pc_table = ignore
llvm_profile = ignore
source_coverage = ignore

[checks:../build/build_*/xdp-server.o]
ubsan = ignore
sancov = ignore
sancov_cmp = ignore
sancov_pc_table = ignore
llvm_profile = ignore
source_coverage = ignore

[checks:../build/build_*/xdp-util.o]
ubsan = ignore
sancov = ignore
sancov_cmp = ignore
sancov_pc_table = ignore
llvm_profile = ignore
source_coverage = ignore

[checks:../build/build_8/iterated_hash.o]
